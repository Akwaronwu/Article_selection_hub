# Ruff configuration (ruff does NOT read pytest.ini — it needs this file).
line-length = 100
target-version = "py313"
exclude = [".venv", "alembic/versions/*"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.flake8-bugbear]
# FastAPI's Depends/File/Form default-argument pattern is idiomatic, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]
